repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Trims trailing whitespace from the end of lines.
        entry: trailing-whitespace-fixer
        language: python
        types: [text]
        pass_filenames: true

      - id: end-of-file-fixer
        name: Ensure files end with a new line
        description: Ensures that a file is either empty, or ends with one blank line.
        entry: end-of-file-fixer
        language: python
        types: [text]
        pass_filenames: true

      - id: check-yaml
        name: Validate YAML files
        description: Checks YAML files for parseable syntax.
        entry: check-yaml
        language: python
        types: [yaml]
        pass_filenames: true

      - id: detect-private-key
        name: Check if any private keys are left unignored
        description: Detects the presence of private keys to prevent them from being committed.
        entry: detect-private-key
        language: python
        types: [text]
        pass_filenames: true

  # Java Code Formatter
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-java
        args: [--autofix, --aosp]

  # Java Linter (Enforces coding standards)
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: forbid-binary
